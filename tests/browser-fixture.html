<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>TypePilot — browser fixture</title>
<style>body{font:16px system-ui;background:#0d1117;color:#f0f4fa;max-width:800px;margin:40px auto;padding:24px}label{display:block;margin:24px 0 8px}textarea,input,[contenteditable]{box-sizing:border-box;width:100%;background:#171f2a;color:#f0f4fa;border:1px solid #61738b;border-radius:8px;padding:16px;font:18px system-ui}textarea{height:180px}[contenteditable]{min-height:100px}small{color:#a9b9cd}h1{font-size:26px}</style>
<h1>Проверка TypePilot в браузере</h1><p>Только локальные тестовые поля. Эта страница ничего никуда не отправляет.</p>
<label for="message">Многострочное сообщение</label><textarea id="message" aria-label="Тестовое сообщение" spellcheck="false"></textarea>
<label for="single">Однострочное поле</label><input id="single" aria-label="Тестовая строка" spellcheck="false">
<label for="editable">Редактируемый блок</label><div id="editable" contenteditable="true" role="textbox" aria-label="Тестовый редактируемый блок" spellcheck="false"></div>
<p><small>Набери «превет » или «прил». Для ИИ: выдели предложение и нажми Ctrl+Alt+Space. Нет форм, кнопки отправки, сети или хранилища.</small></p>
</html>
